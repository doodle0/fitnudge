[project]
name = "fitnudge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "anthropic>=1.13.0",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.31",
    "claude-agent-sdk>=0.2.165",
    "cryptography>=46",
    "discord-py>=2.7.1",
    "fastapi>=0.120",
    "httpx>=0.28",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "python-dotenv>=1.1",
    "redis[hiredis]>=6",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: needs TEST_DATABASE_URL (a disposable PostgreSQL database)",
    "e2e: runs the real Agent SDK CLI against a local fake Messages API",
]
